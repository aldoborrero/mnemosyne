<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Mnemosyne — memory for Hermes</title>
  <desc id="description">An amber M shaped like two arches, connected to a constellation of memory nodes, on an ink blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111f31"/>
      <stop offset="1" stop-color="#080f1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f4d99c"/>
      <stop offset="1" stop-color="#c58b46"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8097b4" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <path d="M48 48H1152M48 352H1152" stroke="#b9c8dc" stroke-opacity=".16"/>
  <g fill="none" stroke="#66849b">
    <circle cx="208" cy="200" r="128" stroke-opacity=".18"/>
    <circle cx="208" cy="200" r="103" stroke-opacity=".24" stroke-dasharray="2 9"/>
    <path d="M110 120L208 72L309 120L337 204L284 290L164 321L80 227Z" stroke-opacity=".35"/>
    <path d="M110 120L164 321M208 72L284 290M80 227L309 120M337 204L164 321" stroke-opacity=".15"/>
  </g>
  <g fill="#91b9c1">
    <circle cx="110" cy="120" r="5"/>
    <circle cx="309" cy="120" r="5"/>
    <circle cx="337" cy="204" r="4"/>
    <circle cx="164" cy="321" r="4"/>
    <circle cx="80" cy="227" r="4"/>
  </g>
  <g fill="#edc986">
    <circle cx="208" cy="72" r="6"/>
    <circle cx="284" cy="290" r="6"/>
  </g>
  <path d="M140 260V168C140 133 208 133 208 178V238V178C208 133 276 133 276 168V260" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="square"/>
  <path d="M126 272H156M193 250H223M261 272H291" stroke="#e8c483" stroke-width="3"/>
  <path d="M388 104V296" stroke="#b9c8dc" stroke-opacity=".2"/>
  <g font-family="Verdana, Geneva, sans-serif">
    <text x="440" y="132" font-size="13" letter-spacing="4" fill="#91b9c1">MEMORY FOR HERMES</text>
    <text x="435" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-2" fill="#f3eee2">Mnemosyne</text>
    <text x="440" y="258" font-size="20" fill="#aebed0">Keep the context. Recall what matters.</text>
    <text x="440" y="310" font-size="11" letter-spacing="2.5" fill="#d5b477">CONTEXT / RECALL / CONTINUITY</text>
  </g>
  <path d="M1116 80V96M1108 88H1124" stroke="#edc986" stroke-width="2"/>
</svg>
