[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne"
version = "0.1.0"
description = "Mnemosyne — composite long-term memory plugin for Hermes Agent. Wraps Honcho (user model) and Hindsight (facts) behind a single MemoryProvider interface with date tags, repetition counting, conflict detection, recovery, and explicit forgetting."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "johnnykor82", email = "johnnykor@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["honcho-ai", "hindsight-client>=0.4.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/johnnykor82/mnemosyne"
Repository = "https://github.com/johnnykor82/mnemosyne"
"Bug Tracker" = "https://github.com/johnnykor82/mnemosyne/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mnemosyne*"]

# Note: pytest config lives in tests/pytest.ini (not here). Putting it there
# pins pytest's rootdir to tests/, preventing it from walking up to the plugin
# root and importing the Hermes directory adapter as the source package.
